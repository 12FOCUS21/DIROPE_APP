name: Pruebas del núcleo y módulos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ${{ matrix.sistema }}
    strategy:
      matrix:
        sistema: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ejecutar pruebas sin dependencias externas
        run: python -m unittest discover -s pruebas -v
  interfaz-y-exportacion:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar el motor PDF opcional declarado
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas con exportación PDF
        run: python -m unittest discover -s pruebas -v
      - name: Comprobar interfaz y persistencia
        run: python iniciar.py --comprobar-interfaz
      - name: Comprobar interfaz sin Pillow
        env:
          DIROPE_SIN_PILLOW: '1'
        run: python iniciar.py --comprobar-interfaz
      - name: Comprobar copia sin paquetes opcionales
        run: python -S iniciar.py --comprobar-interfaz
      - name: Comprobar diagnóstico sin abrir ventanas
        run: python -S iniciar.py --diagnostico
      - name: Comprobar lanzador de Windows
        shell: cmd
        run: call Abrir_programa.bat --diagnostico
      - name: Comprobar contraste
        run: python verificar_contraste.py
