name: Edición web y GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: python herramientas/preparar_web.py
      - run: python -m unittest discover -s pruebas -p test_web.py
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: web
      - run: npm --prefix web run probar
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar:
    if: github.ref == 'refs/heads/main'
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar sitio probado
        id: pages
        uses: actions/deploy-pages@v4
